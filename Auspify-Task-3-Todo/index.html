<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="TaskFlow - A simple and responsive task management application."
    >

    <title>TaskFlow | To-Do Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="app-header">
            <div>
                <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
                <h1>Task<span>Flow</span></h1>
                <p class="subtitle">
                    Organize your day. Complete your goals.
                </p>
            </div>

            <div class="date-box">
                <span id="currentDate"></span>
            </div>
        </header>


        <!-- Add Task -->
        <section class="task-input-section">

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to accomplish?"
                    autocomplete="off"
                    maxlength="100"
                    required
                >

                <button type="submit" class="add-button">
                    + Add Task
                </button>

            </form>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Total Tasks</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="activeTasks">0</span>
                <span class="stat-label">Active</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">Completed</span>
            </div>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR TASKS</p>
                    <h2>Today's List</h2>
                </div>

                <button id="clearCompleted" class="clear-button">
                    Clear Completed
                </button>
            </div>


            <div id="taskList" class="task-list">
                <!-- Tasks will be created by JavaScript -->
            </div>


            <div id="emptyState" class="empty-state">

                <div class="empty-icon">✓</div>

                <h3>No tasks yet</h3>

                <p>
                    Add your first task above and start organizing your day.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>
                Your tasks are saved automatically in your browser.
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
